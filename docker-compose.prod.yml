services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_* 為 build time 內嵌至前端 JS，不能只靠 runtime env_file，需在此明確傳入
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    ports:
      - "3000:3000"
    #environment: #- NODE_ENV=production
    env_file:
      - .env # 加入這一行，載入本機 .env
