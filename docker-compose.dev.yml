# /*
#  * ----------------------------------------------
#  * docker-compose.dev.yml（開發時生效） 
#  * 2025-07-22
#  * ----------------------------------------------
#  */

services:
  db:
    # 僅開發環境對外開 port，方便 host 端工具（psql／prisma CLI）直連除錯；
    # 固定用 15433（而非預設 5432），避免跟其他專案的 Postgres 容器搶同一個 host port
    # （本機同時跑多個專案的 db 容器，5432 常被別的專案佔走，host 連線會連錯到別人的資料庫且無明顯錯誤）
    ports:
      - "127.0.0.1:15433:5432"

  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID}:${GID}"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    ports:
      - "5555:5555"
    env_file:
      - .env
    command: npx prisma studio --browser none --port 5555
    depends_on:
      - db
    profiles:
      - studio

  web:
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules # 專案目錄模式
      - ./ssl:/app/ssl # 自簽憑證掛載進入容器
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=6144

  cloudflared:
    image: cloudflare/cloudflared:latest
    # 強制 http2：避免 WSL2/Docker 的 QUIC/UDP 問題
    # TUNNEL_TOKEN 由環境變數傳入，不放在 command 避免解析錯誤
    command: tunnel --no-autoupdate --protocol http2 run
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
